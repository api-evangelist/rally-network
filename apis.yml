aid: rally-network
name: Rally Network
description: >-
  Rally Network (RLY Protocol, stewarded by the RLY Network Association) is a permissionless,
  open-source, multi-chain web3 mobile toolkit for developers. It provides natively embedded,
  self-custodial wallets and gasless (gas station / ERC-2771 relayer) transactions so mobile
  apps can let users create wallets, transfer tokens, claim NFTs, and deploy or call smart
  contracts without handling gas or seed phrases. The toolkit ships as first-party SDKs for
  React Native/Expo, Flutter, and Unity plus TypeScript libraries and a hosted dashboard for
  API keys and configuration. Rally Network is the successor to the original rally.io social-token
  platform (creator coins), which decentralized in 2021 and wound down its consumer sidechain in
  early 2023; the RLY Network Association now maintains the open protocol and developer tooling.
